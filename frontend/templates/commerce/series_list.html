{% extends "base.html" %}

{% block title %}电商带货 - 海带 AI 内容智能创作平台{% endblock %}

{% block content %}
<div class="mx-auto max-w-6xl py-8">
    <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
        <div>
            <p class="text-sm font-semibold text-emerald-200">电商带货</p>
            <h1 class="mt-2 text-3xl font-bold">电商系列</h1>
            <p class="mt-2 text-white/50">围绕一个模特持续管理多个服装商品，生成口播种草和试穿展示内容。</p>
        </div>
        <a href="/commerce/series/create/" class="inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-500 px-4 py-2.5 font-semibold text-white hover:bg-emerald-400">
            <i data-lucide="plus" class="h-4 w-4"></i>
            创建电商系列
        </a>
    </div>

    <div id="commerceSeriesList" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
        <div class="glass-card p-6 text-white/50">加载中...</div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    fetch('/commerce/api/series/')
        .then(response => response.json())
        .then(result => {
            const list = result.data || [];
            const container = document.getElementById('commerceSeriesList');
            if (!list.length) {
                container.innerHTML = `
                    <div class="glass-card col-span-full p-8 text-center">
                        <h2 class="text-xl font-semibold">还没有电商系列</h2>
                        <p class="mt-2 text-white/50">先创建一个真人写实服装带货系列。</p>
                        <a href="/commerce/series/create/" class="mt-5 inline-flex rounded-xl bg-emerald-500 px-4 py-2.5 font-semibold text-white">创建电商系列</a>
                    </div>
                `;
                return;
            }
            container.innerHTML = list.map(item => `
                <a href="/commerce/series/${item.id}/" class="glass-card block p-5 transition hover:-translate-y-0.5 hover:border-emerald-300/40">
                    <div class="mb-4 flex items-center justify-between">
                        <span class="rounded-full bg-emerald-400/15 px-3 py-1 text-xs font-semibold text-emerald-100">服装 / 真人写实</span>
                        <span class="text-xs text-white/40">${item.defaultAspectRatio || '3:4'}</span>
                    </div>
                    <h2 class="text-lg font-semibold">${escapeCommerceHtml(item.name || '未命名电商系列')}</h2>
                    <p class="mt-2 text-sm text-white/45">模特 -> 商品 -> 口播/试穿视频</p>
                </a>
            `).join('');
        });
});

function escapeCommerceHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    }[char]));
}
</script>
{% endblock %}
