{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绑定手机号 - 海带 AI 内容智能创作平台</title>
    <link rel="icon" type="image/png" href="/favicon.ico?v=ba68be9c">
    <meta name="robots" content="noindex,nofollow">
    <link rel="canonical" href="{{ seo.canonical_url }}">
    <link rel="stylesheet" href="{% static 'css/site.css' %}?v=20261123">
    <script>
        window.lucide = window.lucide || {createIcons() {}};
    </script>
    <script defer src="{% static 'vendor/lucide/lucide.min.js' %}?v=20260801"
            onload="if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
                'Microsoft YaHei', 'PingFang SC', sans-serif;
            min-height: 100vh;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            overflow: hidden;
        }
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(ellipse 70% 45% at 50% -15%, rgba(120, 119, 198, 0.28), transparent),
                radial-gradient(ellipse 55% 40% at 95% 100%, rgba(74, 222, 128, 0.14), transparent),
                radial-gradient(ellipse 40% 60% at 0% 50%, rgba(147, 51, 234, 0.18), transparent);
        }
        .auth-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 46px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.58), 0 0 90px -50px rgba(34,211,238,0.4);
            backdrop-filter: blur(52px) saturate(150%);
        }
        .logo-icon-wrap {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 18px 36px -12px rgba(34,211,238,0.45);
        }
        .logo-icon-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .auth-title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, #a7f3d0 55%, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-subtitle {
            text-align: center;
            margin-bottom: 28px;
            color: rgba(255,255,255,0.54);
            font-size: 14px;
            line-height: 1.7;
        }
        .form-group { margin-bottom: 18px; }
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.72);
            font-size: 13px;
            font-weight: 600;
        }
        .input-wrapper { position: relative; }
        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 46px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.035);
            color: #fff;
            font-size: 14px;
        }
        .form-input:focus {
            outline: none;
            border-color: rgba(34,211,238,0.55);
            box-shadow: 0 0 0 4px rgba(34,211,238,0.1);
        }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.36);
        }
        .code-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            padding: 8px 13px;
            border: 1px solid rgba(34,211,238,0.32);
            border-radius: 8px;
            background: rgba(34,211,238,0.14);
            color: #cffafe;
            font-size: 12px;
            cursor: pointer;
        }
        .code-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .submit-btn {
            width: 100%;
            height: 52px;
            margin-top: 8px;
            border: 0;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            background: linear-gradient(135deg, #22c55e, #0891b2);
            box-shadow: 0 16px 32px -16px rgba(34,211,238,0.62);
            cursor: pointer;
        }
        .auth-footer {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }
        .auth-footer a { color: #a7f3d0; font-weight: 700; }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(15,23,42,0.92);
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>

    {% if messages %}
    {% for message in messages %}
    <div class="toast {{ message.tags }} show">
        <i data-lucide="{% if message.tags == 'success' %}check-circle-2{% elif message.tags == 'error' %}circle-x{% else %}circle-alert{% endif %}" class="w-5 h-5"></i>
        <span>{{ message }}</span>
    </div>
    {% endfor %}
    {% endif %}

    <div class="auth-card">
        <div class="logo-icon-wrap">
            <img src="/site-logo.png?v=ba68be9c" alt="海带 AI 内容智能创作平台 Logo">
        </div>
        <h1 class="auth-title">绑定手机号</h1>
        <p class="auth-subtitle">为了继续使用账号，请绑定手机号。绑定完成后，邮箱和手机号都可以登录。</p>

        <form method="post" action="">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">手机号</label>
                <div class="input-wrapper">
                    <input type="tel" name="phone" id="phone" class="form-input" placeholder="请输入手机号" required maxlength="11">
                    <i data-lucide="smartphone" class="w-4 h-4 input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">验证码</label>
                <div class="input-wrapper">
                    <input type="text" name="code" class="form-input" style="padding-right: 100px;" placeholder="输入6位验证码" required maxlength="6">
                    <i data-lucide="message-square-code" class="w-4 h-4 input-icon"></i>
                    <button type="button" id="sendCodeBtn" class="code-btn" onclick="sendCode()">获取验证码</button>
                </div>
            </div>

            <button type="submit" class="submit-btn">完成绑定</button>
        </form>

        <div class="auth-footer">
            不是当前账号？<a href="/auth/logout/">退出登录</a>
        </div>
    </div>

    <script>
        lucide.createIcons();
        setTimeout(() => {
            document.querySelectorAll('.toast').forEach(toast => toast.classList.remove('show'));
        }, 5000);

        let countdown = 0;
        let timer = null;

        function sendCode() {
            const phone = document.getElementById('phone').value.trim();
            if (!phone) {
                alert('请先输入手机号');
                return;
            }
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                alert('请输入正确的手机号');
                return;
            }
            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;
            fetch('/auth/send-code/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name="csrfmiddlewaretoken"]').value
                },
                body: JSON.stringify({ phone: phone, type: 'bind' })
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    alert('验证码已发送到您的手机');
                    startCountdown(60);
                } else {
                    alert(data.message || '发送失败');
                    btn.disabled = false;
                }
            })
            .catch(() => {
                alert('发送失败，请稍后重试');
                btn.disabled = false;
            });
        }

        function startCountdown(seconds) {
            countdown = seconds;
            const btn = document.getElementById('sendCodeBtn');
            btn.textContent = countdown + 's';
            timer = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(timer);
                    btn.textContent = '获取验证码';
                    btn.disabled = false;
                } else {
                    btn.textContent = countdown + 's';
                }
            }, 1000);
        }
    </script>
</body>
</html>
