{% extends 'base.html' %}
{% load static %}

{% block title %}会员体系 - 海带 AI 内容智能创作平台{% endblock %}

{% block extra_css %}
<style>
    .membership-shell {
        max-width: 1320px;
        margin: 0 auto;
    }

    .membership-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
    }

    .pricing-tabs {
        display: grid;
        grid-template-columns: repeat(4, minmax(92px, 1fr));
        gap: 4px;
        width: min(680px, 100%);
        padding: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .pricing-tab {
        height: 42px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.72);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.18s ease, color 0.18s ease;
    }

    .pricing-tab.active {
        background: rgba(255, 255, 255, 0.94);
        color: #10131a;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .membership-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        align-items: stretch;
    }

    .membership-card {
        min-height: 560px;
        display: flex;
        flex-direction: column;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.96);
        color: #111827;
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
        overflow: hidden;
    }

    .membership-card.disabled {
        opacity: 0.64;
    }

    .membership-card-body {
        padding: 30px 28px 24px;
        flex: 1;
    }

    .membership-title {
        font-size: 18px;
        font-weight: 800;
        color: #10131a;
        margin-bottom: 12px;
    }

    .membership-price {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 8px;
    }

    .membership-price strong {
        font-size: 42px;
        line-height: 1;
        letter-spacing: 0;
    }

    .membership-price span {
        color: #6b7280;
        font-size: 13px;
    }

    .membership-subcopy {
        min-height: 38px;
        color: #84909f;
        font-size: 13px;
        line-height: 1.5;
    }

    .credit-box {
        margin: 68px 0 16px;
        padding: 18px;
        border-radius: 6px;
        background: #f4f5f7;
    }

    .credit-box strong {
        display: block;
        font-size: 15px;
        color: #111827;
        margin-bottom: 8px;
    }

    .credit-box span {
        color: #778392;
        font-size: 12px;
    }

    .membership-action {
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 6px;
        background: #101114;
        color: #fff;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.16s ease, background 0.16s ease;
    }

    .membership-action:hover {
        transform: translateY(-1px);
        background: #25272c;
    }

    .membership-action:disabled {
        cursor: not-allowed;
        background: #e6e8ec;
        color: #a0a7b1;
        transform: none;
    }

    .membership-features {
        border-top: 1px solid #e7e9ee;
        padding: 22px 28px 26px;
        min-height: 220px;
    }

    .membership-feature {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
        color: #1f2937;
        margin-bottom: 16px;
    }

    .membership-feature i {
        width: 14px;
        height: 14px;
        color: #111827;
        flex: 0 0 auto;
    }

    .feature-pill {
        flex: 0 0 auto;
        padding: 3px 8px;
        border-radius: 8px;
        background: #f0f1f3;
        color: #111827;
        font-size: 11px;
        font-weight: 800;
    }

    .recharge-section {
        margin-top: 34px;
        padding: 26px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .recharge-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
    }

    .recharge-card {
        padding: 18px;
        border-radius: 8px;
        background: rgba(8, 12, 22, 0.58);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .recharge-card strong {
        display: block;
        font-size: 24px;
        margin-bottom: 8px;
    }

    .recharge-card span {
        display: block;
        color: rgba(255, 255, 255, 0.68);
        font-size: 13px;
        line-height: 1.5;
        min-height: 40px;
    }

    .recharge-card button {
        width: 100%;
        height: 38px;
        margin-top: 14px;
        border: 0;
        border-radius: 6px;
        background: #f8fafc;
        color: #111827;
        font-weight: 800;
        cursor: pointer;
    }

    .payment-modal[hidden] {
        display: none;
    }

    .payment-modal {
        position: fixed;
        inset: 0;
        z-index: 1800;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(2, 6, 15, 0.72);
        backdrop-filter: blur(8px);
    }

    .payment-dialog {
        width: min(100%, 520px);
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: #101722;
        color: #f8fafc;
        box-shadow: 0 24px 72px rgba(0, 0, 0, 0.42);
    }

    .payment-dialog--qr {
        width: min(100%, 480px);
    }

    .payment-modal-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 22px 17px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .payment-modal-eyebrow {
        margin: 0 0 5px;
        color: #7dd3fc;
        font-size: 12px;
        font-weight: 800;
    }

    .payment-modal-title {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        line-height: 1.35;
        letter-spacing: 0;
    }

    .payment-icon-button {
        width: 36px;
        height: 36px;
        flex: 0 0 36px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        color: #e2e8f0;
        cursor: pointer;
    }

    .payment-icon-button i,
    .payment-icon-button svg {
        width: 18px;
        height: 18px;
    }

    .payment-modal-body {
        padding: 22px;
    }

    .payment-product-summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-width: 0;
        margin-bottom: 18px;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.04);
    }

    .payment-product-summary span {
        min-width: 0;
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        overflow-wrap: anywhere;
    }

    .payment-product-summary strong {
        flex: 0 0 auto;
        color: #fff;
        font-size: 18px;
    }

    .payment-method-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .payment-method-option {
        min-height: 112px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 7px;
        padding: 17px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.045);
        color: #f8fafc;
        text-align: left;
        cursor: pointer;
        transition: border-color 0.16s ease, background 0.16s ease;
    }

    .payment-method-option:hover,
    .payment-method-option:focus-visible {
        border-color: rgba(125, 211, 252, 0.7);
        background: rgba(14, 165, 233, 0.1);
        outline: none;
    }

    .payment-method-option i,
    .payment-method-option svg {
        width: 22px;
        height: 22px;
        color: #7dd3fc;
    }

    .payment-method-option strong {
        font-size: 15px;
    }

    .payment-method-option span {
        color: rgba(255, 255, 255, 0.55);
        font-size: 12px;
        line-height: 1.45;
    }

    .payment-method-error {
        margin: 0 0 14px;
        padding: 11px 12px;
        border: 1px solid rgba(248, 113, 113, 0.32);
        border-radius: 6px;
        background: rgba(239, 68, 68, 0.09);
        color: #fecaca;
        font-size: 13px;
        line-height: 1.5;
    }

    .payment-qr-stage {
        width: min(100%, 256px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        margin: 0 auto 18px;
        padding: 12px;
        border-radius: 8px;
        background: #fff;
    }

    .payment-qr-stage canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
    }

    .payment-qr-status {
        margin: 0;
        color: #bae6fd;
        font-size: 15px;
        font-weight: 800;
        text-align: center;
    }

    .payment-qr-countdown {
        min-height: 22px;
        margin: 7px 0 17px;
        color: rgba(255, 255, 255, 0.6);
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        text-align: center;
    }

    .payment-order-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
    }

    .payment-order-row code {
        min-width: 0;
        color: #e2e8f0;
        font-size: 12px;
        overflow-wrap: anywhere;
        text-align: right;
    }

    .payment-qr-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 18px;
    }

    .payment-action-button {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 9px 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        color: #f8fafc;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
    }

    .payment-action-button--primary {
        border-color: #e2e8f0;
        background: #f8fafc;
        color: #111827;
    }

    .payment-action-button:disabled {
        cursor: wait;
        opacity: 0.55;
    }

    .payment-action-button i,
    .payment-action-button svg {
        width: 16px;
        height: 16px;
    }

    @media (max-width: 1120px) {
        .membership-grid,
        .recharge-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    @media (max-width: 720px) {
        .membership-toolbar {
            align-items: stretch;
        }

        .pricing-tabs {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            border-radius: 18px;
        }

        .membership-grid,
        .recharge-grid {
            grid-template-columns: 1fr;
        }

        .membership-card {
            min-height: auto;
        }

        .credit-box {
            margin-top: 36px;
        }
    }

    @media (max-width: 430px) {
        .payment-modal {
            padding: 12px;
        }

        .payment-dialog {
            max-height: calc(100vh - 24px);
        }

        .payment-modal-header,
        .payment-modal-body {
            padding: 18px;
        }

        .payment-method-grid,
        .payment-qr-actions {
            grid-template-columns: 1fr;
        }

        .payment-method-option {
            min-height: 86px;
        }

        .payment-qr-stage {
            width: min(100%, 220px);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .membership-action,
        .payment-method-option {
            transition: none;
        }
    }
</style>
{% endblock %}

{% block content %}
<div id="member-pricing-app" class="membership-shell">
    <div class="membership-toolbar">
        <div>
            <p class="text-sm text-cyan-200 font-semibold mb-2">会员体系</p>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-normal">会员与积分充值</h1>
        </div>
        <div class="pricing-tabs" id="periodTabs"></div>
    </div>

    <div class="membership-grid" id="membershipGrid"></div>

    <section class="recharge-section">
        <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
            <div>
                <p class="text-sm text-amber-200 font-semibold mb-2">积分充值</p>
                <h2 class="text-2xl font-extrabold">50 元 1000 积分起，会员少量加赠</h2>
            </div>
            <p class="text-sm text-white/55">赠送积分 30 天有效，最高级会员 50 元封顶 1150 积分</p>
        </div>
        <div class="recharge-grid" id="rechargeGrid"></div>
    </section>
</div>

<div class="payment-modal" id="paymentMethodModal" role="dialog" aria-modal="true" aria-labelledby="paymentMethodTitle" hidden>
    <div class="payment-dialog">
        <div class="payment-modal-header">
            <div>
                <p class="payment-modal-eyebrow">支付宝</p>
                <h2 class="payment-modal-title" id="paymentMethodTitle">选择支付方式</h2>
            </div>
            <button class="payment-icon-button" type="button" aria-label="关闭支付方式选择" title="关闭" data-close-payment-method>
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="payment-modal-body">
            <div class="payment-product-summary">
                <span id="paymentMethodProductName"></span>
                <strong id="paymentMethodAmount"></strong>
            </div>
            <p class="payment-method-error" id="paymentMethodError" role="alert" hidden></p>
            <div class="payment-method-grid">
                <button class="payment-method-option" id="paymentMethodQr" type="button" onclick="selectPaymentMethod('QR')">
                    <i data-lucide="qr-code"></i>
                    <strong>扫码支付</strong>
                    <span>使用支付宝扫描二维码完成支付</span>
                </button>
                <button class="payment-method-option" id="paymentMethodPage" type="button" onclick="selectPaymentMethod('PAGE')">
                    <i data-lucide="external-link"></i>
                    <strong>支付宝收银台</strong>
                    <span>跳转支付宝网页收银台完成支付</span>
                </button>
            </div>
        </div>
    </div>
</div>

<div class="payment-modal" id="paymentQrModal" role="dialog" aria-modal="true" aria-labelledby="paymentQrTitle" hidden>
    <div class="payment-dialog payment-dialog--qr">
        <div class="payment-modal-header">
            <div>
                <p class="payment-modal-eyebrow">支付宝扫码支付</p>
                <h2 class="payment-modal-title" id="paymentQrTitle">请使用支付宝扫码</h2>
            </div>
            <button class="payment-icon-button" type="button" aria-label="关闭扫码支付" title="关闭" data-close-payment-qr>
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="payment-modal-body">
            <div class="payment-product-summary">
                <span id="paymentQrProductName"></span>
                <strong id="paymentQrAmount"></strong>
            </div>
            <div class="payment-qr-stage">
                <canvas id="paymentQrCanvas" width="232" height="232" aria-label="支付宝支付二维码"></canvas>
            </div>
            <p class="payment-qr-status" id="paymentQrStatus" role="status" aria-live="polite">等待扫码支付</p>
            <p class="payment-qr-countdown" id="paymentQrCountdown">正在读取有效期</p>
            <div class="payment-order-row">
                <span>订单号</span>
                <code id="paymentQrOrderNo"></code>
            </div>
            <div class="payment-qr-actions">
                <button class="payment-action-button payment-action-button--primary" id="paymentQrSync" type="button" onclick="syncQrOrder()">
                    <i data-lucide="refresh-cw"></i>
                    <span>立即查询</span>
                </button>
                <button class="payment-action-button" type="button" data-close-payment-qr>
                    <i data-lucide="x"></i>
                    <span>关闭</span>
                </button>
                <button class="payment-action-button" id="paymentQrRegenerate" type="button" onclick="regenerateQrPayment()" hidden>
                    <i data-lucide="rotate-cw"></i>
                    <span>重新生成</span>
                </button>
                <button class="payment-action-button" id="paymentQrCashier" type="button" onclick="switchQrToCashier()">
                    <i data-lucide="external-link"></i>
                    <span>切换收银台</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'vendor/qrcode/qrcode.min.js' %}"></script>
<script>
    const IS_AUTHENTICATED = {{ request.session.token|yesno:"true,false" }};
    const tabs = [
        {key: 'YEAR', label: '包年'},
        {key: 'MONTH', label: '包月'},
        {key: 'QUARTER', label: '包季'},
        {key: 'SINGLE_MONTH', label: '单月购买'}
    ];
    const fallbackProducts = {
        membershipProducts: {
            YEAR: [
                {code: 'year_basic', tier: 'BASIC', title: '基础会员', priceCents: 65900, monthlyCredits: 725, enabled: true, buttonText: '购买包年基础会员', features: []},
                {code: 'year_standard', tier: 'STANDARD', title: '标准会员', priceCents: 189900, monthlyCredits: 2210, enabled: true, buttonText: '购买包年标准会员', features: []},
                {code: 'year_advanced', tier: 'ADVANCED', title: '高级会员', priceCents: 519900, monthlyCredits: 12320, enabled: true, buttonText: '购买包年高级会员', features: []},
                {code: 'year_super', tier: 'SUPER', title: '超级会员', priceCents: 0, monthlyCredits: 54600, enabled: false, buttonText: '敬请期待', features: []}
            ],
            MONTH: [
                {code: 'month_basic', tier: 'BASIC', title: '基础会员', priceCents: 6900, monthlyCredits: 725, enabled: true, buttonText: '购买包月基础会员', features: []},
                {code: 'month_standard', tier: 'STANDARD', title: '标准会员', priceCents: 19900, monthlyCredits: 2210, enabled: true, buttonText: '购买包月标准会员', features: []},
                {code: 'month_advanced', tier: 'ADVANCED', title: '高级会员', priceCents: 99800, monthlyCredits: 12320, enabled: true, buttonText: '购买包月高级会员', features: []},
                {code: 'month_super', tier: 'SUPER', title: '超级会员', priceCents: 429900, monthlyCredits: 54600, enabled: true, buttonText: '购买包月超级会员', features: []}
            ],
            QUARTER: [
                {code: 'quarter_basic', tier: 'BASIC', title: '基础会员', priceCents: 18800, monthlyCredits: 725, enabled: true, buttonText: '购买包季基础会员', features: []},
                {code: 'quarter_standard', tier: 'STANDARD', title: '标准会员', priceCents: 56800, monthlyCredits: 2210, enabled: true, buttonText: '购买包季标准会员', features: []},
                {code: 'quarter_advanced', tier: 'ADVANCED', title: '高级会员', priceCents: 195900, monthlyCredits: 12320, enabled: true, buttonText: '购买包季高级会员', features: []},
                {code: 'quarter_super', tier: 'SUPER', title: '超级会员', priceCents: 818900, monthlyCredits: 54600, enabled: true, buttonText: '购买包季超级会员', features: []}
            ],
            SINGLE_MONTH: [
                {code: 'single_month_basic', tier: 'BASIC', title: '基础会员', priceCents: 7900, monthlyCredits: 725, enabled: true, buttonText: '购买基础会员', features: []},
                {code: 'single_month_standard', tier: 'STANDARD', title: '标准会员', priceCents: 23900, monthlyCredits: 2210, enabled: true, buttonText: '购买标准会员', features: []},
                {code: 'single_month_advanced', tier: 'ADVANCED', title: '高级会员', priceCents: 64900, monthlyCredits: 12320, enabled: true, buttonText: '购买高级会员', features: []},
                {code: 'single_month_super', tier: 'SUPER', title: '超级会员', priceCents: 0, monthlyCredits: 54600, enabled: false, buttonText: '敬请期待', features: []}
            ]
        },
        rechargePackages: [
            {amountCents: 5000, baseCredits: 1000, bonusCredits: 0, totalCredits: 1000, bonusPercent: 0},
            {amountCents: 10000, baseCredits: 2000, bonusCredits: 0, totalCredits: 2000, bonusPercent: 0},
            {amountCents: 20000, baseCredits: 4000, bonusCredits: 0, totalCredits: 4000, bonusPercent: 0},
            {amountCents: 50000, baseCredits: 10000, bonusCredits: 0, totalCredits: 10000, bonusPercent: 0}
        ]
    };
    const defaultFeatures = ['Seedance 2.0', 'Seedance 1.5 Pro', '图片4.0', '标准生成通道', '无忧退款', '生成作品去除品牌水印'];
    let currentTab = 'MONTH';
    let productsState = fallbackProducts;
    let pendingPayment = null;
    let currentQrOrder = null;
    let paymentFocusReturn = null;
    let qrPollTimer = null;
    let qrCountdownTimer = null;
    let qrSyncInFlight = false;

    document.addEventListener('DOMContentLoaded', () => {
        renderTabs();
        renderAll();
        loadProducts();

        document.querySelectorAll('[data-close-payment-method]').forEach(button => {
            button.addEventListener('click', closePaymentMethodModal);
        });
        document.querySelectorAll('[data-close-payment-qr]').forEach(button => {
            button.addEventListener('click', closePaymentQrModal);
        });
        document.getElementById('paymentMethodModal').addEventListener('click', event => {
            if (event.target === event.currentTarget) closePaymentMethodModal();
        });
        document.getElementById('paymentQrModal').addEventListener('click', event => {
            if (event.target === event.currentTarget) closePaymentQrModal();
        });
        document.addEventListener('keydown', handlePaymentModalKeydown);
    });

    document.addEventListener('visibilitychange', () => {
        if (!currentQrOrder || document.getElementById('paymentQrModal').hidden) return;
        if (document.hidden) {
            stopQrPolling();
            return;
        }
        updateQrCountdown();
        syncQrOrder();
        startQrPolling();
    });

    function renderTabs() {
        const container = document.getElementById('periodTabs');
        container.innerHTML = tabs.map(tab => `
            <button class="pricing-tab ${tab.key === currentTab ? 'active' : ''}" onclick="switchTab('${tab.key}')">${tab.label}</button>
        `).join('');
    }

    function switchTab(tabKey) {
        currentTab = tabKey;
        renderTabs();
        renderMembershipCards();
    }

    function renderAll() {
        renderMembershipCards();
        renderRechargeCards();
        if (window.lucide) {
            lucide.createIcons();
        }
    }

    async function loadProducts() {
        try {
            const response = await fetch('/api/payments/products/');
            const payload = await response.json();
            if (payload.code === 200 && payload.data) {
                productsState = payload.data;
                renderAll();
            }
        } catch (error) {
            // Keep the bundled product catalog when the API is unavailable.
        }
    }

    function renderMembershipCards() {
        const products = (productsState.membershipProducts || {})[currentTab] || [];
        document.getElementById('membershipGrid').innerHTML = products.map(product => {
            const features = product.features && product.features.length ? product.features : defaultFeatures;
            return `
                <article class="membership-card ${product.enabled ? '' : 'disabled'}">
                    <div class="membership-card-body">
                        <h2 class="membership-title">${product.title}</h2>
                        <div class="membership-price">
                            <span>¥</span>
                            <strong>${product.enabled ? formatPrice(product.priceCents) : '????'}</strong>
                            <span>${periodUnit(currentTab)}</span>
                        </div>
                        <p class="membership-subcopy">${periodCopy(currentTab, product)}</p>
                        <div class="credit-box">
                            <strong>✦ ${formatNumber(product.monthlyCredits)} 积分每月</strong>
                            <span>换算 ¥10≈${Math.round(product.monthlyCredits / 8)} 积分</span>
                        </div>
                        <button class="membership-action" ${product.enabled ? '' : 'disabled'} onclick="openPaymentMethodModal('MEMBERSHIP', '${product.code}', this)">${product.buttonText || '购买'}</button>
                    </div>
                    <div class="membership-features">
                        ${features.map((feature, index) => `
                            <div class="membership-feature">
                                <span class="flex items-center gap-3"><i data-lucide="check"></i>${feature}</span>
                                ${featureBadge(index, feature)}
                            </div>
                        `).join('')}
                    </div>
                </article>
            `;
        }).join('');
        if (window.lucide) {
            lucide.createIcons();
        }
    }

    function renderRechargeCards() {
        const packages = productsState.rechargePackages || fallbackProducts.rechargePackages;
        document.getElementById('rechargeGrid').innerHTML = packages.map(item => `
            <article class="recharge-card">
                <strong>¥${formatPrice(item.amountCents)}</strong>
                <span>${formatNumber(item.baseCredits)} 基础积分${item.bonusCredits ? `，加赠 ${formatNumber(item.bonusCredits)} 积分` : ''}<br>合计 ${formatNumber(item.totalCredits)} 积分</span>
                <button onclick="openPaymentMethodModal('RECHARGE', ${item.amountCents}, this)">前往支付宝支付</button>
            </article>
        `).join('');
    }

    function openPaymentMethodModal(orderType, identifier, button) {
        if (!ensureAuthenticated()) return;

        if (orderType === 'MEMBERSHIP') {
            const product = findMembershipProduct(identifier);
            if (!product) return;
            pendingPayment = {
                orderType,
                url: '/api/payments/membership/orders/',
                payload: {productCode: identifier},
                productName: String(product.buttonText || product.title).replace(/^购买/, ''),
                amountCents: product.priceCents,
                button
            };
        } else if (orderType === 'RECHARGE') {
            const rechargePackage = findRechargePackage(identifier);
            if (!rechargePackage) return;
            pendingPayment = {
                orderType,
                url: '/api/payments/recharge/orders/',
                payload: {amountCents: Number(identifier)},
                productName: `积分充值 ${formatNumber(rechargePackage.totalCredits)} 积分`,
                amountCents: rechargePackage.amountCents,
                button
            };
        } else {
            return;
        }

        paymentFocusReturn = button || document.activeElement;
        showPaymentMethodModal();
    }

    function findMembershipProduct(productCode) {
        const groups = productsState.membershipProducts || {};
        const fallbackGroups = fallbackProducts.membershipProducts;
        for (const group of [groups, fallbackGroups]) {
            for (const products of Object.values(group)) {
                const product = products.find(item => item.code === productCode);
                if (product) return product;
            }
        }
        return null;
    }

    function findRechargePackage(amountCents) {
        const packages = productsState.rechargePackages || [];
        return packages.find(item => Number(item.amountCents) === Number(amountCents)) ||
            fallbackProducts.rechargePackages.find(item => item.amountCents === Number(amountCents));
    }

    function showPaymentMethodModal(errorMessage = '', preferPage = false) {
        if (!pendingPayment) return;
        document.getElementById('paymentMethodProductName').textContent = pendingPayment.productName;
        document.getElementById('paymentMethodAmount').textContent = formatCurrency(pendingPayment.amountCents);
        const error = document.getElementById('paymentMethodError');
        error.textContent = errorMessage;
        error.hidden = !errorMessage;
        const modal = document.getElementById('paymentMethodModal');
        showPaymentModal(modal, document.getElementById(preferPage ? 'paymentMethodPage' : 'paymentMethodQr'));
    }

    function closePaymentMethodModal() {
        hidePaymentModal(document.getElementById('paymentMethodModal'), true);
    }

    function selectPaymentMethod(selectedPaymentMethod) {
        if (!pendingPayment || !['QR', 'PAGE'].includes(selectedPaymentMethod)) return;
        hidePaymentModal(document.getElementById('paymentMethodModal'), false);
        createOrder(selectedPaymentMethod);
    }

    async function createOrder(selectedPaymentMethod) {
        if (!pendingPayment) return;
        const payment = pendingPayment;
        const button = payment.button;
        const originalButtonText = button ? button.textContent : '';
        if (button) {
            button.disabled = true;
            if (selectedPaymentMethod === 'PAGE') {
                button.textContent = '正在前往支付宝';
            } else {
                button.textContent = '正在生成二维码';
            }
        }
        const payload = {...payment.payload, paymentMethod: selectedPaymentMethod};

        try {
            const response = await fetch(payment.url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await response.json().catch(() => null);
            if (response.status === 401 || (data && data.code === 401)) {
                window.location.href = '/auth/login/';
                return;
            }
            if (!response.ok || !data || data.code !== 200 || !data.data) {
                throw new Error((data && data.message) || '创建订单失败');
            }
            if (selectedPaymentMethod === 'PAGE') {
                submitAlipayForm(data.data.paymentHtml);
            } else {
                await showQrPayment(data.data);
            }
        } catch (error) {
            const message = error.message || '创建订单失败';
            const qrUnavailable = selectedPaymentMethod === 'QR' && isQrUnavailableError(message);
            showPaymentMethodModal(
                qrUnavailable ? '当前暂未开通订单码支付，请切换支付宝收银台。' : message,
                qrUnavailable
            );
        } finally {
            if (button) restoreOrderButton(button, originalButtonText);
        }
    }

    function restoreOrderButton(button, originalButtonText) {
        button.disabled = false;
        button.textContent = originalButtonText;
    }

    function submitAlipayForm(paymentHtml) {
        if (typeof paymentHtml !== 'string' || !paymentHtml.trim()) {
            throw new Error('支付宝支付表单为空，请稍后重试');
        }

        const parsedDocument = new DOMParser().parseFromString(paymentHtml, 'text/html');
        const sourceForms = parsedDocument.querySelectorAll('form');
        if (sourceForms.length !== 1) {
            throw new Error('支付宝支付表单无效，请稍后重试');
        }

        const sourceForm = sourceForms[0];
        if (sourceForm.method.toUpperCase() !== 'POST') {
            throw new Error('支付宝支付方式无效，请稍后重试');
        }

        const actionValue = sourceForm.getAttribute('action');
        let action;
        try {
            action = new URL(actionValue, window.location.href);
        } catch (error) {
            throw new Error('支付宝支付地址无效，请稍后重试');
        }

        const allowedAlipayHosts = new Set([
            'openapi.alipay.com',
            'openapi-sandbox.dl.alipaydev.com'
        ]);
        if (
            action.protocol !== 'https:' ||
            !allowedAlipayHosts.has(action.host) ||
            action.pathname !== '/gateway.do'
        ) {
            throw new Error('支付宝支付地址不受信任，请稍后重试');
        }

        const sourceInputs = sourceForm.querySelectorAll('input[name]');
        if (!sourceInputs.length) {
            throw new Error('支付宝支付参数缺失，请稍后重试');
        }

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = action.href;
        form.target = '_self';
        form.hidden = true;

        sourceInputs.forEach(sourceInput => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = sourceInput.getAttribute('name');
            input.value = sourceInput.value;
            form.appendChild(input);
        });

        document.body.appendChild(form);
        form.submit();
    }

    async function showQrPayment(order) {
        if (!order.orderNo || !order.qrCode) {
            throw new Error('支付宝二维码为空，请切换支付宝收银台');
        }

        currentQrOrder = {
            orderNo: String(order.orderNo),
            status: order.status || 'CREATED',
            expiresAt: parsePaymentExpiry(order.expiresAt),
            productName: order.productName || pendingPayment.productName,
            amountCents: Number.isFinite(Number(order.amountCents)) ? Number(order.amountCents) : pendingPayment.amountCents
        };
        document.getElementById('paymentQrProductName').textContent = currentQrOrder.productName;
        document.getElementById('paymentQrAmount').textContent = formatCurrency(currentQrOrder.amountCents);
        document.getElementById('paymentQrOrderNo').textContent = currentQrOrder.orderNo;
        document.getElementById('paymentQrRegenerate').hidden = true;
        document.getElementById('paymentQrSync').disabled = false;
        setQrStatus(currentQrOrder.status);
        showPaymentModal(document.getElementById('paymentQrModal'), document.getElementById('paymentQrSync'));

        const canvas = document.getElementById('paymentQrCanvas');
        const context = canvas.getContext('2d');
        context.clearRect(0, 0, canvas.width, canvas.height);
        try {
            if (!window.QRCode || typeof QRCode.toCanvas !== 'function') {
                throw new Error('二维码组件加载失败');
            }
            await QRCode.toCanvas(canvas, order.qrCode, {
                width: 232,
                margin: 1,
                errorCorrectionLevel: 'M',
                color: {dark: '#101114', light: '#ffffff'}
            });
            startQrPolling();
        } catch (error) {
            stopQrPolling();
            currentQrOrder.status = 'FAILED';
            document.getElementById('paymentQrStatus').textContent = '二维码生成失败，请切换支付宝收银台';
            document.getElementById('paymentQrCountdown').textContent = '';
            document.getElementById('paymentQrRegenerate').hidden = false;
            document.getElementById('paymentQrSync').disabled = true;
        }
    }

    function startQrPolling() {
        stopQrPolling();
        if (!isQrOrderActive()) return;
        updateQrCountdown();
        qrCountdownTimer = setInterval(updateQrCountdown, 1000);
        if (!document.hidden) {
            qrPollTimer = setInterval(() => {
                syncQrOrder();
            }, 5000);
        }
    }

    function stopQrPolling() {
        if (qrPollTimer !== null) {
            clearInterval(qrPollTimer);
            qrPollTimer = null;
        }
        if (qrCountdownTimer !== null) {
            clearInterval(qrCountdownTimer);
            qrCountdownTimer = null;
        }
    }

    function isQrOrderActive() {
        return Boolean(
            currentQrOrder &&
            currentQrOrder.status === 'CREATED' &&
            !document.getElementById('paymentQrModal').hidden
        );
    }

    function updateQrCountdown() {
        if (!currentQrOrder) return;
        const countdown = document.getElementById('paymentQrCountdown');
        if (!currentQrOrder.expiresAt) {
            countdown.textContent = '有效期以订单状态为准';
            return;
        }

        const remainingSeconds = Math.max(0, Math.ceil((currentQrOrder.expiresAt - Date.now()) / 1000));
        if (remainingSeconds <= 0) {
            countdown.textContent = '二维码已过期';
            if (currentQrOrder.status === 'CREATED') {
                currentQrOrder.status = 'EXPIRED';
                document.getElementById('paymentQrStatus').textContent = '订单已过期，请重新生成';
                document.getElementById('paymentQrRegenerate').hidden = false;
                document.getElementById('paymentQrSync').disabled = true;
                stopQrPolling();
            }
            return;
        }

        const hours = Math.floor(remainingSeconds / 3600);
        const minutes = Math.floor((remainingSeconds % 3600) / 60);
        const seconds = remainingSeconds % 60;
        countdown.textContent = `二维码有效期 ${padTime(hours)}:${padTime(minutes)}:${padTime(seconds)}`;
    }

    async function syncQrOrder() {
        if (!currentQrOrder || qrSyncInFlight || currentQrOrder.status !== 'CREATED') return;
        const orderNo = currentQrOrder.orderNo;
        const syncButton = document.getElementById('paymentQrSync');
        qrSyncInFlight = true;
        syncButton.disabled = true;

        try {
            const response = await fetch(`/api/payments/orders/${encodeURIComponent(orderNo)}/sync/`, {
                method: 'POST'
            });
            const data = await response.json().catch(() => null);
            if (response.status === 401 || (data && data.code === 401)) {
                window.location.href = '/auth/login/';
                return;
            }
            if (!response.ok || !data || data.code !== 200 || !data.data) {
                throw new Error((data && data.message) || '订单状态查询失败');
            }
            if (!currentQrOrder || currentQrOrder.orderNo !== orderNo) return;
            if (data.data.expiresAt) {
                currentQrOrder.expiresAt = parsePaymentExpiry(data.data.expiresAt);
            }
            setQrStatus(data.data.status || currentQrOrder.status);
            updateQrCountdown();
        } catch (error) {
            if (currentQrOrder && currentQrOrder.orderNo === orderNo && currentQrOrder.status === 'CREATED') {
                document.getElementById('paymentQrStatus').textContent = '状态查询失败，可立即重试';
            }
        } finally {
            qrSyncInFlight = false;
            if (currentQrOrder && currentQrOrder.orderNo === orderNo && currentQrOrder.status === 'CREATED') {
                syncButton.disabled = false;
            }
        }
    }

    function setQrStatus(status) {
        if (!currentQrOrder) return;
        currentQrOrder.status = status;
        const statusElement = document.getElementById('paymentQrStatus');
        const regenerateButton = document.getElementById('paymentQrRegenerate');
        const syncButton = document.getElementById('paymentQrSync');

        if (status === 'PAID') {
            stopQrPolling();
            statusElement.textContent = '支付成功，权益已到账';
            regenerateButton.hidden = true;
            syncButton.disabled = true;
            if (typeof loadUserCredits === 'function') {
                loadUserCredits();
            }
            return;
        }
        if (status === 'CLOSED' || status === 'FAILED') {
            stopQrPolling();
            statusElement.textContent = status === 'CLOSED' ? '订单已关闭，请重新生成' : '支付失败，请重新生成';
            regenerateButton.hidden = false;
            syncButton.disabled = true;
            return;
        }

        statusElement.textContent = '等待扫码支付';
        regenerateButton.hidden = true;
        syncButton.disabled = false;
    }

    function regenerateQrPayment() {
        if (!pendingPayment) return;
        stopQrPolling();
        currentQrOrder = null;
        hidePaymentModal(document.getElementById('paymentQrModal'), false);
        createOrder('QR');
    }

    function switchQrToCashier() {
        if (!pendingPayment) return;
        stopQrPolling();
        currentQrOrder = null;
        hidePaymentModal(document.getElementById('paymentQrModal'), false);
        createOrder('PAGE');
    }

    function closePaymentQrModal() {
        stopQrPolling();
        currentQrOrder = null;
        hidePaymentModal(document.getElementById('paymentQrModal'), true);
    }

    function showPaymentModal(modal, initialFocus) {
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        if (window.lucide) lucide.createIcons();
        window.requestAnimationFrame(() => initialFocus && initialFocus.focus());
    }

    function hidePaymentModal(modal, restoreFocus) {
        modal.hidden = true;
        const hasOpenModal = ['paymentMethodModal', 'paymentQrModal'].some(id => !document.getElementById(id).hidden);
        if (!hasOpenModal) document.body.style.overflow = '';
        if (restoreFocus && paymentFocusReturn) {
            const focusTarget = paymentFocusReturn;
            paymentFocusReturn = null;
            window.requestAnimationFrame(() => focusTarget.focus());
        }
    }

    function handlePaymentModalKeydown(event) {
        const modal = getOpenPaymentModal();
        if (!modal) return;
        if (event.key === 'Escape') {
            event.preventDefault();
            if (modal.id === 'paymentQrModal') closePaymentQrModal();
            else closePaymentMethodModal();
            return;
        }
        if (event.key !== 'Tab') return;

        const focusable = Array.from(modal.querySelectorAll(
            'button:not([disabled]):not([hidden]), [href], input:not([disabled]), [tabindex]:not([tabindex="-1"])'
        )).filter(element => element.offsetParent !== null);
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (!modal.contains(document.activeElement)) {
            event.preventDefault();
            (event.shiftKey ? last : first).focus();
        } else if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
        }
    }

    function getOpenPaymentModal() {
        const qrModal = document.getElementById('paymentQrModal');
        if (!qrModal.hidden) return qrModal;
        const methodModal = document.getElementById('paymentMethodModal');
        return methodModal.hidden ? null : methodModal;
    }

    function isQrUnavailableError(message) {
        return String(message).includes('ACQ.ACCESS_FORBIDDEN') || String(message).includes('未开通订单码');
    }

    function parsePaymentExpiry(expiresAt) {
        const timestamp = new Date(expiresAt).getTime();
        return Number.isFinite(timestamp) ? timestamp : null;
    }

    function padTime(value) {
        return String(value).padStart(2, '0');
    }

    function ensureAuthenticated() {
        if (IS_AUTHENTICATED) {
            return true;
        }
        window.location.href = '/auth/login/';
        return false;
    }

    function formatPrice(cents) {
        return Math.round((cents || 0) / 100).toString();
    }

    function formatCurrency(cents) {
        const amount = Number(cents || 0) / 100;
        return `¥${amount.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }

    function formatNumber(value) {
        return Number(value || 0).toLocaleString('en-US');
    }

    function periodUnit(period) {
        if (period === 'YEAR') return '每年';
        if (period === 'QUARTER') return '每季';
        return '每月';
    }

    function periodCopy(period, product) {
        if (!product.enabled) return '更高额度套餐正在准备中';
        return '单次支付，到期自动结束';
    }

    function featureBadge(index, feature) {
        if (index === 0) return '<span class="feature-pill">专属通道</span>';
        if (feature.includes('1.5')) return '<span class="feature-pill">生成 8 折</span>';
        if (feature.includes('4K')) return '<span class="feature-pill">4K 限时免费</span>';
        if (feature.includes('图片4.0')) return '<span class="feature-pill">2K 限时免费</span>';
        return '';
    }
</script>
{% endblock %}
